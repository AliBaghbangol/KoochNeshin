<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>آفلاین — کوچ‌نشین</title>
<link rel="icon" href="/favicon-32.png">
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: Vazirmatn, "Segoe UI", Tahoma, sans-serif;
    background: #081411;
    color: #f7f3ec;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 24px 20px;
    overflow: hidden;
  }
  .stars { position: fixed; inset: 0; pointer-events: none; }
  .star { position: absolute; background: #f7f3ec; border-radius: 50%; animation: twinkle 3.2s ease-in-out infinite; }
  @keyframes twinkle { 0%,100% { opacity:.2; transform:scale(.8);} 50% { opacity:1; transform:scale(1.2);} }
  .moon {
    position: fixed; top: -60px; left: 8%; width: 260px; height: 260px; border-radius: 50%;
    background: radial-gradient(circle, rgba(217,169,78,.22), transparent 65%);
    pointer-events: none;
  }
  .inner { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; text-align: center; max-width: 460px; }
  svg.scene { width: min(340px, 88vw); margin-bottom: 4px; }
  .dash { animation: march 1.1s linear infinite; }
  @keyframes march { to { stroke-dashoffset: -10; } }
  .glow { animation: glowpulse 2.6s ease-in-out infinite; transform-origin: 288px 96px; }
  @keyframes glowpulse { 0%,100% { opacity:.75; transform:scale(1);} 50% { opacity:1; transform:scale(1.12);} }
  .smoke { animation: smoke 2.8s ease-in-out infinite; }
  @keyframes smoke { 0% { transform: translateY(0); opacity:0;} 25% { opacity:.9;} 100% { transform: translateY(-16px); opacity:0;} }
  .compass { animation: float 3.4s ease-in-out infinite; transform-origin: 150px 94px; }
  @keyframes float { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-5px);} }
  h1.big {
    font-size: clamp(84px, 24vw, 128px);
    font-weight: 900; line-height: 1;
    background: linear-gradient(to bottom, #f7f3ec 30%, rgba(217,169,78,.8));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  h2 { display:flex; align-items:center; justify-content:center; gap:8px; font-size: 20px; font-weight: 800; margin-top: 10px; }
  h2 svg { width: 20px; height: 20px; stroke: #d9a94e; }
  p.sub { font-size: 13px; line-height: 1.9; color: rgba(247,243,236,.6); margin-top: 8px; max-width: 340px; }
  .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 28px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; cursor: pointer;
    background: #0f6b4a; color: #f7f3ec; font: inherit; font-size: 14px; font-weight: 800;
    min-height: 48px; padding: 0 26px; border-radius: 999px; box-shadow: 0 10px 26px -10px rgba(15,107,74,.7);
    transition: transform .15s, filter .15s;
  }
  .btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
  .btn.ghost { background: transparent; border: 2px solid rgba(247,243,236,.25); box-shadow: none; }
  .btn.ghost:hover { border-color: rgba(217,169,78,.6); color: #d9a94e; }
  .btn svg { width: 17px; height: 17px; stroke: currentColor; }
  .waiting {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-top: 30px; padding: 10px 18px; border-radius: 999px; font-size: 12px; font-weight: 700;
    color: rgba(247,243,236,.7); border: 1px solid rgba(217,169,78,.2); background: rgba(217,169,78,.05);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #d9a94e; position: relative; flex: none; }
  .dot::after { content:""; position:absolute; inset:0; border-radius:50%; background:#d9a94e; animation: ping 1.6s ease-out infinite; }
  @keyframes ping { 0% { transform: scale(1); opacity:.7;} 80%,100% { transform: scale(2.2); opacity:0;} }
  @media (prefers-reduced-motion: reduce) {
    .star, .dash, .glow, .smoke, .compass, .dot::after { animation: none !important; }
  }
</style>
</head>
<body>
  <div class="stars" id="stars" aria-hidden="true"></div>
  <div class="moon" aria-hidden="true"></div>

  <div class="inner" role="alertdialog" aria-label="حالت آفلاین کوچ‌نشین — صفحه ۴۰۴">
    <svg class="scene" viewBox="0 0 320 150" role="img" aria-label="مسیر کاروان که به چادری روشن ختم می‌شود">
      <path class="dash" d="M8 132 C 70 112, 118 140, 176 118 S 252 96, 292 102" fill="none" stroke="#d9a94e" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 9" opacity="0.75"/>
      <circle class="glow" cx="288" cy="96" r="26" fill="rgba(217,169,78,0.12)"/>
      <path d="M288 62 L316 108 H260 Z" fill="#123b2c" stroke="#1f5a41" stroke-width="1.5"/>
      <path class="glow" d="M288 76 L301 108 H275 Z" fill="#d9a94e"/>
      <path d="M288 62 V50 h10 v6 h-10" fill="none" stroke="#d9a94e" stroke-width="2" stroke-linecap="round"/>
      <circle class="smoke" cx="284" cy="46" r="3" fill="rgba(247,243,236,0.5)"/>
      <circle class="smoke" style="animation-delay:.9s" cx="292" cy="42" r="2.4" fill="rgba(247,243,236,0.4)"/>
      <circle class="smoke" style="animation-delay:1.7s" cx="287" cy="38" r="2" fill="rgba(247,243,236,0.3)"/>
      <g class="compass" opacity="0.9">
        <circle cx="150" cy="94" r="11" fill="#0b241c" stroke="#2d8f6f" stroke-width="1.5"/>
        <path d="M150 87 l3.2 7.4 -3.2 6.6 -3.2 -6.6 Z" fill="#d9a94e"/>
      </g>
    </svg>

    <h1 class="big">۴۰۴</h1>
    <h2>
      <svg fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><line x1="2" y1="2" x2="22" y2="22"/><path d="M18.36 6.64a19 19 0 0 0-5.06-2.06 18.93 18.93 0 0 0-8.36.56"/><path d="M5.6 11.1a13.97 13.97 0 0 1 3.1-1.36"/><path d="M10.2 15.5a8 8 0 0 1 3.6-1"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
      اتصال قطع شد!
    </h2>
    <p class="sub">این‌بار مقصر ستاره‌ها نیستن — اینترنت رسیدن به اردوگاه قطعه. تا وصل شدن دوباره، چادر و آتیش همین‌جا منتظرتن.</p>

    <div class="actions">
      <button class="btn" onclick="location.reload()">
        <svg fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
        تلاش دوباره
      </button>
      <button class="btn ghost" onclick="goBack()">ادامه مرور آفلاین</button>
    </div>

    <div class="waiting"><span class="dot"></span> <span id="waitingText">منتظر برگشت اتصال… وقتی وصل شدی خودکار برمی‌گردیم</span></div>
  </div>

<script>
(function () {
  "use strict";
  /* deterministic star field — same formula as the app's 404 scene */
  var starBox = document.getElementById("stars");
  for (var i = 0; i < 46; i++) {
    var s = document.createElement("span");
    s.className = "star";
    var sz = 1 + ((i * 11) % 3) * 0.6;
    var x = ((i * 37.7) % 100 + ((i * i * 13) % 17) / 17) % 100;
    var y = ((i * 53.3) % 62) + ((i * 7) % 13) / 4;
    s.style.cssText = "left:" + x + "%;top:" + y + "%;width:" + sz + "px;height:" + sz +
      "px;opacity:" + (0.35 + ((i * 17) % 50) / 100) + ";animation-delay:" + ((i * 29) % 40) / 10 + "s";
    starBox.appendChild(s);
  }

  function goBack() { history.length > 1 ? history.back() : (location.href = "/"); }
  window.goBack = goBack;

  /* ------------------------------------------------------------------
   * Auto-recovery, v2 (server-down safe):
   * The old logic only listened for the `online` event — but when the
   * SERVER (not the client network) hiccups, navigator.onLine stays
   * `true` and that event never fires, stranding the traveler here
   * forever. Now we actively probe the camp gate (same-origin HEAD with
   * cache: no-store) every 2.5s; the first successful probe — from the
   * poll OR from a late `online` event — walks us back to the exact
   * URL we were heading to (the SW serves this page transparently, so
   * location.href IS the original destination).
   * ------------------------------------------------------------------ */
  var recovering = false;
  var waitingChip = document.getElementById("waitingText");

  function enterRecovery() {
    if (recovering) return;
    recovering = true;
    document.querySelectorAll(".btn").forEach(function (b) { b.disabled = true; b.style.opacity = ".6"; });
    if (waitingChip) waitingChip.textContent = "وصل شدیم — داریم برمی‌گردیم به اردوگاه…";
    /* small delay so the traveler actually sees the good news */
    setTimeout(function () { location.reload(); }, 650);
  }

  function probe() {
    if (recovering) return;
    fetch(location.href, { method: "HEAD", cache: "no-store" })
      .then(function (res) {
        /* any real HTTP answer (even 404/403) means the camp gate answers */
        if (res && res.status < 500) enterRecovery();
      })
      .catch(function () { /* still down — keep waiting silently */ });
  }

  setInterval(probe, 2500);
  window.addEventListener("online", function () { setTimeout(probe, 300); });
})();
</script>
</body>
</html>
